# Validates lint + production build against a real Postgres (same as production).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmtvotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tmtvotes_test"
          --health-interval 8s
          --health-timeout 5s
          --health-retries 8

    env:
      NEXT_PUBLIC_PRESENTATION_MODE: "0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tmtvotes_test?schema=public
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long
      VOTER_ID_PEPPER: ci-voter-pepper-16min
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_DISPLAY_NAME: CI Admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma sync
        run: npx prisma db push

      - name: Seed
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
