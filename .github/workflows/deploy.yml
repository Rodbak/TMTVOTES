name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve base path from repo name
        id: basepath
        run: echo "value=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE: ${{ steps.basepath.outputs.value }}
        run: npm run build

      - name: SPA fallback (404 page)
        run: cp out/index.html out/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
